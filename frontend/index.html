<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Lab App</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 16px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Frontend + Backend через nginx</h1>
  <button onclick="loadData()">Получить данные от бэкенда</button>
  <pre id="result">Нажми кнопку...</pre>

  <script>
    async function loadData() {
      try {
        // Идём через nginx (относительный путь)
        const res = await fetch('/api/hello');
        const data = await res.json();
        document.getElementById('result').textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById('result').textContent = 'Ошибка: ' + err.message;
      }
    }
  </script>
</body>
</html>
